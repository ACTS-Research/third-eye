<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../icon-180.png" />
    <title>Third Eye Cam — Control</title>
  </head>
  <body>
    <header id="top">
      <span class="wordmark">Third Eye Cam</span>
      <div id="pills"></div>
      <nav id="views" aria-label="Screen">
        <button data-view="perform">Perform</button>
        <button data-view="edit">Edit</button>
        <button data-view="setup">Setup</button>
      </nav>
      <!-- Tools as icons, then record alone in the corner. -->
      <button id="midi-map-toggle" class="tool" title="MIDI map: assign MIDI controls to anything outlined (M)" aria-label="MIDI map"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4.9" cy="10" r="1.2" fill="currentColor"/><circle cx="6.4" cy="6.4" r="1.2" fill="currentColor"/><circle cx="10" cy="4.9" r="1.2" fill="currentColor"/><circle cx="13.6" cy="6.4" r="1.2" fill="currentColor"/><circle cx="15.1" cy="10" r="1.2" fill="currentColor"/><path d="M8.6 18 V15.6 H11.4 V18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <div id="palette" role="group" aria-label="Colour palette"></div>
      <button id="rec" data-midi="record" title="Record the output (R)" disabled>REC</button>
    </header>
    <div id="map-hint" hidden></div>
    <div id="alerts"></div>
    <main>
      <section id="view-perform" class="view" aria-label="Perform"></section>
      <section id="view-edit" class="view" aria-label="Edit preset" hidden></section>
      <section id="view-setup" class="view" aria-label="Setup" hidden></section>
    </main>
    <script type="module" src="../src/control/main.js"></script>
  </body>
</html>
