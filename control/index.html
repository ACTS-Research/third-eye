<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="icon" href="../icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="../icon-180.png" />
    <title>3rdEyeCam — Control</title>
  </head>
  <body>
    <header id="top">
      <span class="wordmark">3rdEyeCam</span>
      <div id="pills"></div>
      <nav id="views" aria-label="Screen">
        <button data-view="perform">Perform</button>
        <button data-view="edit">Edit</button>
        <button data-view="setup">Setup</button>
      </nav>
      <button id="rec" data-midi="record" title="Record the output (R)" disabled>REC</button>
      <button id="midi-map-toggle" title="Assign MIDI controls to anything outlined (M)">MIDI map</button>
      <div id="palette" role="group" aria-label="Colour palette"></div>
    </header>
    <div id="map-hint" hidden></div>
    <div id="alerts"></div>
    <main>
      <section id="view-perform" class="view" aria-label="Perform"></section>
      <section id="view-edit" class="view" aria-label="Edit preset" hidden></section>
      <section id="view-setup" class="view" aria-label="Setup" hidden></section>
    </main>
    <script type="module" src="../src/control/main.js"></script>
  </body>
</html>
