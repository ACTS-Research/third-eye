name: Build and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The MediaPipe models (about 42 MB) are downloaded and checksummed by
      # the prebuild step; cache them so most builds never hit the network.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: mediapipe-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploys only from the repository's default branch. Pages must be enabled
  # once under Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
