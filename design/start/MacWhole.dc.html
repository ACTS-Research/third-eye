<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac splash M2, over the whole window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#060303}
button{font:inherit;cursor:pointer}
.cap{text-transform:uppercase;letter-spacing:0.08em}
.qr{width:190px;height:190px;flex-shrink:0;background-color:#fff;background-image:repeating-linear-gradient(0deg,#000 0 6px,transparent 6px 14px),repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 12px);border:12px solid #fff;box-sizing:border-box}
.lid{transform-origin:35px 37px;animation:blink 6s ease-in-out infinite}
.iris{transform-origin:35px 37px;animation:look 9s ease-in-out infinite}
.ring{transform-origin:35px 37px;animation:ring 3s ease-out infinite;fill:none;stroke:#ff6b5e;stroke-width:1}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(0.08)}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@keyframes ring{0%{transform:scale(0.5);opacity:0.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.lid,.iris,.ring{animation:none}}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px}
.step b{font:800 34px/1 'Big Shoulders Display',sans-serif}
</style>
</helmet>
<div style="width: 1000px; height: 700px; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 28px; background: #060303; color: #ff6b5e; font: 500 12px/1.45 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.02em">

  <div style="display: flex; align-items: center; gap: 28px">
    <svg viewBox="0 6 64 58" width="200" height="181" role="img" aria-label="Third Eye Cam: a camera with an eye for a lens" style="flex-shrink: 0">
      <path d="M12 14H42V10A2 2 0 0 1 44 8H52A2 2 0 0 1 54 10V14.2A9 9 0 0 1 61 23V51A9 9 0 0 1 52 60H12A9 9 0 0 1 3 51V23A9 9 0 0 1 12 14Z" fill="#ff6b5e"></path>
      <rect x="9" y="20" width="9" height="5" rx="1.5" fill="#060303"></rect>
      <g class="lid"><path d="M35 18Q53 37 35 56Q17 37 35 18Z" fill="#060303"></path>
        <g class="iris"><circle cx="35" cy="37" r="7" fill="#ff6b5e"></circle><circle cx="35" cy="37" r="2.6" fill="#060303"></circle></g>
        <circle class="ring" cx="35" cy="37" r="4"></circle>
      </g>
    </svg>
    <div>
      <div style="font: 800 104px/0.85 'Big Shoulders Display', sans-serif; letter-spacing: 0.08em">THIRD EYE CAM</div>
      <div class="cap" style="color: #ffb3ab; margin-top: 12px; font-size: 14px">A live video instrument. The iPhone is the camera and the controller.</div>
    </div>
  </div>

  <div style="display: flex; gap: 32px; align-items: center; border-top: 1px solid #5b2622; padding-top: 28px">
    <div class="qr" role="img" aria-label="QR code for pairing"></div>
    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-width: 0">
      <div class="step"><b>1</b><span>Point the iPhone's camera at this code and open the link.</span></div>
      <div class="step"><b>2</b><span>Tap START on the phone and allow the camera and motion.</span></div>
      <div class="step"><b>3</b><span>This screen gives way to the picture.</span></div>
      <div style="font-size: 14px">Room code <b style="font: 800 28px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.14em">PSAQ2</b> · Ready for the phone</div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; margin-top: auto; flex-wrap: wrap">
    <span class="cap" style="color: #ffb3ab">No phone today?</span>
    <button class="cap" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; padding: 10px 14px">Use the Mac camera</button>
    <button class="cap" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; padding: 10px 14px">Test pattern</button>
    <button class="cap" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; padding: 10px 14px">Video file…</button>
    <button class="cap" style="background: none; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 10px 14px; margin-left: auto">Skip to the controls</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
