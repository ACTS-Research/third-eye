<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 Shows in Setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060303}
button{font-family:'JetBrains Mono',monospace}
</style>
</helmet>
<div style="width: 1440px; height: 620px; position: relative; overflow: hidden; background: #060303; color: #ff6b5e; font-family: 'JetBrains Mono', monospace; font-size: 13px; box-sizing: border-box; display: flex">
  <div style="width: 720px; border-right: 1px solid #5b2622; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <h2 style="margin: 0; font: 800 22px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.1em; flex: 1">SETUP · SHOWS</h2>
      <button style="background: transparent; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 5px 10px">+ NEW SHOW</button>
      <button style="background: transparent; color: #ff6b5e; border: 1px solid #5b2622; padding: 5px 10px">OPEN A SHOW FILE…</button>
    </div>
    <sc-for list="{{shows}}" as="s" hint-placeholder-count="3">
      <div style="{{s.box}}">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font: 800 24px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; flex: 1">{{s.name}}</span>
          <sc-if value="{{s.live}}" hint-placeholder-val="{{false}}"><span style="background: #ff6b5e; color: #140302; padding: 2px 8px; font-weight: 700; font-size: 11px">LIVE</span></sc-if>
          <sc-if value="{{s.notLive}}" hint-placeholder-val="{{true}}"><button style="background: transparent; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 4px 10px">MAKE LIVE</button></sc-if>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{s.steps}}" as="st" hint-placeholder-count="4">
            <span style="border: 1px solid #5b2622; padding: 2px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">{{st}}</span>
          </sc-for>
        </div>
        <div style="display: flex; gap: 14px; font-size: 12px; color: #cd564c">
          <span>Rename</span><span>Duplicate</span><span>Delete</span><span>Save to a file…</span>
        </div>
      </div>
    </sc-for>
    <label style="display: flex; align-items: center; gap: 10px; margin-top: 4px"><input type="checkbox" checked="checked" style="accent-color: #ff6b5e"> Save a copy of a show to Downloads whenever it changes</label>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column">
    <div style="flex: 1; background: #000; display: flex; align-items: center; justify-content: center; color: #5b2622; font-size: 12px; letter-spacing: 0.1em">THE PERFORM SCREEN, FOR COMPARISON</div>
    <div style="border-top: 1px solid #5b2622; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-weight: 700; letter-spacing: 0.08em">DREAM MACHINE</span>
        <button style="background: #ff6b5e; color: #140302; border: 1px solid #ff6b5e; padding: 5px 10px">RUNNING ORDER · 6</button>
        <button style="background: transparent; color: #ff6b5e; border: 1px solid #5b2622; padding: 5px 10px">ALL PRESETS</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="min-height: 80px; border: 1px solid #ff6b5e; padding: 8px 10px; box-sizing: border-box; font: 800 36px/0.9 'Big Shoulders Display', sans-serif">1</div>
        <div style="min-height: 80px; border: 1px solid #ff6b5e; background: #ff6b5e; color: #140302; padding: 8px 10px; box-sizing: border-box; font: 800 36px/0.9 'Big Shoulders Display', sans-serif">2</div>
        <div style="min-height: 80px; border: 2px dashed #ff6b5e; padding: 7px 9px; box-sizing: border-box; font: 800 36px/0.9 'Big Shoulders Display', sans-serif">3</div>
        <div style="min-height: 80px; border: 1px solid #ff6b5e; padding: 8px 10px; box-sizing: border-box; font: 800 36px/0.9 'Big Shoulders Display', sans-serif">4</div>
      </div>
    </div>
    <div style="padding: 0 12px 14px; font-size: 12px; color: #cd564c">S3 · shows are made and kept in Setup, between performances; the strip only names the live one, so nothing new sits on the perform screen.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const SHOWS = [
      { name: 'Dream machine', steps: ['Clean', 'Time wake', 'Relief', 'Tunnel', 'Relief', 'Clean'] },
      { name: 'Tunnel piece', steps: ['Tunnel', 'Kaleido', 'Liquid', 'Tunnel'] },
      { name: 'Studio test', steps: ['Clean', 'Neon edges', 'Poster'] },
    ];
    return {
      shows: SHOWS.map((s, i) => ({
        ...s,
        live: i === 0,
        notLive: i !== 0,
        box: i === 0
          ? 'border: 2px solid #ff6b5e; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px'
          : 'border: 1px solid #5b2622; padding: 13px 15px; display: flex; flex-direction: column; gap: 10px',
      })),
    };
  }
}
</script>
</body>
</html>
