<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M3 In MIDI map mode, on the hint strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060303}
button{font-family:'JetBrains Mono',monospace;cursor:pointer}
button:disabled{cursor:default}
.mi:hover:not(:disabled){background:#1c0c0b}
</style>
</helmet>
<div style="width: 1440px; height: 600px; position: relative; overflow: hidden; background: #060303; color: #ff6b5e; font-family: 'JetBrains Mono', monospace; font-size: 13px; box-sizing: border-box">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 48px; border-bottom: 1px solid #5b2622; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
    <span style="border: 1px solid #5b2622; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.06em">Output off</span>
    <span style="border: 1px solid #5b2622; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.06em">Phone: live</span>
    <span style="margin-left: auto; background: #ff6b5e; color: #140302; border: 1px solid #ff6b5e; padding: 5px 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">Perform</span>
    <span style="border: 1px solid #5b2622; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.06em">Edit</span>
    <span style="border: 1px solid #5b2622; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.06em">Setup</span>
    <span style="background: #ff6b5e; color: #140302; border: 1px solid #ff6b5e; padding: 5px 9px; display: flex">
      <svg viewBox="0 0 20 20" width="18" height="18" role="img" aria-label="MIDI map, on"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.5"></circle><circle cx="4.9" cy="10" r="1.2" fill="currentColor"></circle><circle cx="6.4" cy="6.4" r="1.2" fill="currentColor"></circle><circle cx="10" cy="4.9" r="1.2" fill="currentColor"></circle><circle cx="13.6" cy="6.4" r="1.2" fill="currentColor"></circle><circle cx="15.1" cy="10" r="1.2" fill="currentColor"></circle><path d="M8.6 18 V15.6 H11.4 V18" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>
    </span>
    <span style="border: 1px solid #5b2622; padding: 5px 10px; text-transform: uppercase; letter-spacing: 0.06em">Rec</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 48px; height: 36px; border-bottom: 1px solid #ff6b5e; display: flex; align-items: center; gap: 12px; padding: 0 14px; box-sizing: border-box; font-weight: 700; z-index: 2; background: #060303">
    <span style="background: #ff6b5e; color: #140302; padding: 2px 8px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0">MIDI map · Dream machine</span>
    <span role="status" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{hint}}</span>
    <button onClick="{{toggle}}" aria-expanded="{{open}}" style="margin-left: auto; flex-shrink: 0; background: transparent; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 4px 10px">Copy from another show ▾</button>
  </div>
  <div style="position: absolute; left: 0; top: 84px; right: 0; height: 190px; background: #000; display: flex; align-items: center; justify-content: center; color: #cd564c; font-size: 12px; letter-spacing: 0.1em">THE PICTURE</div>
  <div style="position: absolute; left: 0; right: 0; top: 274px; bottom: 0; border-top: 1px solid #5b2622; padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <button style="background: #ff6b5e; color: #140302; border: 1px solid #ff6b5e; padding: 5px 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Dream machine</button>
      <button style="background: transparent; color: #ff6b5e; border: 1px solid #5b2622; padding: 5px 10px; letter-spacing: 0.06em; text-transform: uppercase">All presets</button>
      <button style="position: relative; background: transparent; color: #ff6b5e; border: 1px solid #5b2622; padding: 5px 10px 14px; outline: 2px dashed #ff6b5e; outline-offset: 2px">[ PREV<span style="{{labelStyle}}">{{prevLabel}}</span></button>
      <button style="position: relative; background: transparent; color: #ff6b5e; border: 1px solid #5b2622; padding: 5px 10px 14px; outline: 2px dashed #ff6b5e; outline-offset: 2px">NEXT ]<span style="{{labelStyle}}">{{nextLabel}}</span></button>
      <span style="margin-left: auto; color: #cd564c; font-size: 12px">Next: 3 Relief</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <div style="{{t.style}}">
          <span style="font: 800 40px/0.9 'Big Shoulders Display', sans-serif">{{t.num}}</span>
          <span style="text-transform: uppercase; letter-spacing: 0.06em">{{t.name}}</span>
          <sc-if value="{{t.label}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 3px; bottom: 3px; background: #060303; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 0 4px; font-size: 10px; line-height: 1.5">{{t.label}}</span></sc-if>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; border-top: 1px solid #5b2622; padding-top: 10px">
      <button style="background: transparent; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 5px 10px; letter-spacing: 0.08em; text-transform: uppercase">Show: Dream machine ▴</button>
      <button style="background: transparent; color: #cd564c; border: 0; padding: 5px 4px; font-size: 12px">Save show to a file…</button>
    </div>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; right: 14px; top: 82px; width: 330px; background: #060303; border: 1px solid #ff6b5e; padding: 6px; display: flex; flex-direction: column; z-index: 3; box-sizing: border-box">
      <div style="font-size: 10px; color: #cd564c; padding: 4px 8px 2px; letter-spacing: 0.08em">{{midiHead}}</div>
      <sc-for list="{{others}}" as="m" hint-placeholder-count="2">
        <button class="mi" onClick="{{m.pick}}" disabled="{{m.none}}" style="{{m.style}}"><span>{{m.name}}</span><span style="color: #cd564c">{{m.count}}</span></button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{asking}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 50%; top: 100px; width: 460px; margin-left: -230px; background: #2b2b2e; color: #f2f2f2; border-radius: 10px; padding: 18px 20px; box-sizing: border-box; font: 13px/1.45 system-ui, sans-serif; z-index: 5; box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px">
      <div style="font-weight: 600">Chrome asks</div>
      <div>{{askText}}</div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button onClick="{{cancel}}" style="font: 13px system-ui, sans-serif; background: #46464a; color: #f2f2f2; border: 0; border-radius: 16px; padding: 7px 18px">Cancel</button>
        <button onClick="{{ok}}" style="font: 13px system-ui, sans-serif; background: #a8c7fa; color: #062e6f; border: 0; border-radius: 16px; padding: 7px 22px">OK</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true, ask: -1, copied: false }; }
  renderVals() {
    const STEPS = ['Clean', 'Time wake', 'Relief', 'Tunnel', 'Relief', 'Clean'];
    const MINE = ['Note 1.36', 'Note 1.37', 'Note 1.38', 'Note 1.39', 'Note 1.40', 'Note 1.41'];
    const THEIRS = ['Note 10.48', 'Note 10.49', 'Note 10.50', 'Note 10.51', '', ''];
    const OTHERS = [{ name: 'Tunnel piece', n: 9 }, { name: 'Studio test', n: 0 }];
    const copied = this.state.copied;
    const mine = copied ? 9 : 14;
    const base = 'position: relative; min-height: 92px; border: 1px solid #ff6b5e; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 10px; box-sizing: border-box; outline: 2px dashed #ff6b5e; outline-offset: 2px;';
    const on = base + ' background: #ff6b5e; color: #140302;';
    const row = 'display: flex; justify-content: space-between; text-align: left; background: transparent; border: 0; padding: 6px 8px; font-size: 13px;';
    const asked = OTHERS[this.state.ask];
    const plural = (n) => (n === 1 ? '1 control' : n + ' controls');
    return {
      open: this.state.open,
      hint: copied ? '9 controls copied from Tunnel piece. Click an outlined control to change one. Esc to finish.' : 'Click an outlined control, then move a knob or press a pad. Delete clears a control. Esc to finish.',
      toggle: () => this.setState({ open: !this.state.open }),
      labelStyle: 'position: absolute; right: 2px; bottom: 1px; background: #060303; color: #ff6b5e; border: 1px solid #ff6b5e; padding: 0 3px; font-size: 9px; line-height: 1.3; font-weight: 400',
      prevLabel: copied ? 'Note 10.36' : 'Note 1.48',
      nextLabel: copied ? 'Note 10.37' : 'Note 1.49',
      tiles: STEPS.map((name, i) => ({ num: String(i + 1), name, label: (copied ? THEIRS : MINE)[i], style: i === 1 ? on : base })),
      midiHead: 'THIS SHOW HAS ' + plural(mine).toUpperCase() + ' · COPY FROM',
      others: OTHERS.map((o, i) => ({
        name: o.name,
        count: o.n ? plural(o.n) : 'nothing mapped',
        none: !o.n,
        style: row + (o.n ? ' color: #ff6b5e;' : ' color: #cd564c;'),
        pick: () => this.setState({ open: false, ask: i }),
      })),
      asking: !!asked,
      askText: asked ? 'Replace the ' + plural(mine) + ' of Dream machine with the ' + plural(asked.n) + ' of ' + asked.name + '? Phone triggers are not touched.' : '',
      cancel: () => this.setState({ ask: -1 }),
      ok: () => this.setState({ ask: -1, copied: true }),
    };
  }
}
</script>
</body>
</html>
