<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: the six buttons follow the running order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#060303}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; display: grid; grid-template-rows: 26px minmax(0, 1fr); background: #060303; color: #ff6b5e; font: 500 11px/1.3 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.02em; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #5b2622; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px">
    <span style="font: 800 15px/1 'Big Shoulders Display', 'Arial Narrow', sans-serif; letter-spacing: 0.12em">THIRD EYE CAM</span>
    <span>Live · 30 fps</span>
    <span style="margin-left: auto; color: #cd564c">Friday show · step {{stepText}}</span>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px 46px; gap: 10px; padding: 10px 12px; min-height: 0">

    <div style="display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0">
      <div role="img" aria-label="The camera preview, which is also the XY pad" style="width: 100%; aspect-ratio: 16 / 9; background: conic-gradient(from {{pic.turn}} at 50% 56%, #ff2a55, #ffd21e, #36ff8f, #1ec8ff, #7b45ff, #ff2a55); filter: hue-rotate({{pic.hue}}) saturate({{pic.sat}}); position: relative; overflow: hidden; border: 1px solid #5b2622">
        <div style="position: absolute; inset: 18% 30%; border-radius: 50%; background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 62%); mix-blend-mode: screen"></div>
        <div style="position: absolute; left: 62%; top: 38%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #000"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-rows: 62px minmax(0, 1fr) 40px; gap: 8px; min-height: 0">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="background: none; color: #ff6b5e; border: 2px solid #ff6b5e; border-radius: 2px; font: 700 24px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.06em">GLITCH</button>
        <button style="background: none; color: #ff6b5e; border: 2px solid #ff6b5e; border-radius: 2px; font: 700 24px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.06em">FREEZE</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0">
        <sc-for list="{{buttons}}" as="b" hint-placeholder-count="6">
          <button onClick="{{b.pick}}" aria-label="{{b.label}}" style="background: {{b.bg}}; color: {{b.fg}}; border: {{b.border}}; border-radius: 2px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; padding: 6px 8px; min-width: 0; min-height: 0; overflow: hidden">
            <span style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%"><span style="font: 800 30px/0.9 'Big Shoulders Display', sans-serif">{{b.n}}</span><span style="font-size: 9px; letter-spacing: 0.08em">{{b.tag}}</span></span>
            <span style="font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{b.name}}</span>
          </button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button aria-label="Flip camera" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; border-radius: 2px; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2"></path><path d="M20 4v4h-4"></path><path d="M20 15a8 8 0 0 1-14 3l-2-2"></path><path d="M4 20v-4h4"></path></svg>
        </button>
        <button aria-label="Torch" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; border-radius: 2px; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v4l-2 3v10h-4V10L8 7z"></path><path d="M12 13v2"></path></svg>
        </button>
        <button aria-label="Lock white balance" style="background: none; color: #ff6b5e; border: 1px solid #5b2622; border-radius: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 11px">
          <svg width="18" height="20" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="14" height="10"></rect><path d="M6 11V7a4 4 0 0 1 8 0v4"></path></svg>
          WB
        </button>
      </div>
    </div>

    <div role="img" aria-label="Zoom bar" style="position: relative; border: 1px solid #ff6b5e; min-height: 0">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: #ff6b5e"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  state = { cue: 1 };

  renderVals() {
    const INK = '#ff6b5e';
    const ON = '#140302';
    const names = ['Clean', 'Tunnel', 'Kaleido', 'Thermal trails', 'Slit-scan', 'Neon edges', 'Liquid', 'Poster', 'Horizon lock'];
    const looks = [[0, 0, 0.9], [40, 0, 1], [120, 60, 1.2], [200, 150, 1.4], [280, 220, 1], [20, 290, 1.6], [160, 100, 0.8], [240, 30, 2], [320, 180, 1.1]];
    // The first six steps of the running order (the same list as the Mac boards).
    const order = [0, 1, 2, 1, 3, 4, 2, 0];
    const { cue } = this.state;
    const nextCue = Math.min(order.length - 1, cue + 1);
    const look = looks[order[cue]];
    return {
      stepText: cue + 1 + ' of ' + order.length,
      pic: { turn: look[0] + 'deg', hue: look[1] + 'deg', sat: String(look[2]) },
      buttons: order.slice(0, 6).map((p, i) => {
        const live = i === cue;
        const upNext = !live && i === nextCue;
        return {
          n: String(i + 1),
          name: names[p],
          tag: live ? 'LIVE' : upNext ? 'NEXT' : '',
          label: 'Step ' + (i + 1) + ', ' + names[p],
          bg: live ? INK : 'transparent',
          fg: live ? ON : INK,
          border: upNext ? '2px dashed ' + INK : '1px solid ' + INK,
          pick: () => this.setState({ cue: i }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
