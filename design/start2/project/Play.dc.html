<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The opening, playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#000}
.k{border:1px solid #5b2622;padding:7px 12px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:none;color:#ff6b5e;cursor:pointer}
.s{color:#c06a60;font-size:11px;line-height:1.5}
</style>
</helmet>
<div style="width: 900px; height: 560px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #000; color: #ff6b5e; font: 500 13px/1.3 'JetBrains Mono', ui-monospace, Menlo, monospace">
<svg viewBox="0 5 64 58" width="352" height="319" role="img" aria-label="Third Eye Cam, opening" style="flex-shrink: 0">
<defs><clipPath id="play-cam"><path d="M12 14H42V10A2 2 0 0 1 44 8H52A2 2 0 0 1 54 10V14.2A9 9 0 0 1 61 23V51A9 9 0 0 1 52 60H12A9 9 0 0 1 3 51V23A9 9 0 0 1 12 14Z"/></clipPath></defs>
<path d="M12 14H42V10A2 2 0 0 1 44 8H52A2 2 0 0 1 54 10V14.2A9 9 0 0 1 61 23V51A9 9 0 0 1 52 60H12A9 9 0 0 1 3 51V23A9 9 0 0 1 12 14Z" fill="{{bodyFill}}" stroke="#ff6b5e" stroke-width="2.7" stroke-linejoin="round"/>
<path d="{{cellsD}}" fill="#000" clip-path="url(#play-cam)" shape-rendering="crispEdges"/>
<sc-if value="{{shut}}" hint-placeholder-val="{{ true }}"><path d="M11.5 38Q32 39.5 52.5 38" fill="none" stroke="{{eyeInk}}" stroke-width="2.7" stroke-linecap="round"/></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><g opacity="{{eyeOpacity}}"><path d="M11.5 38Q32 18 52.5 38Q32 58 11.5 38Z" fill="none" stroke="{{eyeInk}}" stroke-width="2.7" stroke-linejoin="round"/><circle cx="32" cy="38" r="4.05" fill="none" stroke="{{eyeInk}}" stroke-width="2.7"/></g></sc-if>
</svg>
<div style="font-size: 20px; font-weight: 700; opacity: {{textOpacity}}; transition: opacity 0.4s">Point the iPhone's camera at the code.</div>
<div style="letter-spacing: 0.2em; text-transform: uppercase; opacity: {{textOpacity}}; transition: opacity 0.4s">Room code SB2ZR</div>
<div style="display: flex; gap: 10px; margin-top: 2px; opacity: {{textOpacity}}; transition: opacity 0.4s"><span class="k">Use the Mac camera</span><span class="k">Test pattern</span><span class="k">Video file…</span></div>
<div style="display: flex; gap: 12px; align-items: center; margin-top: auto"><button class="k" onClick="{{replay}}">Play again</button><span class="s">{{caption}}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":560}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { t: 0 };
this.start = Date.now();
}
componentDidMount() {
this.timer = setInterval(() => {
let t = Date.now() - this.start;
if (t > 8000) { this.start = Date.now(); t = 0; }
this.setState({ t });
}, 40);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const t = this.state.t;
// The moments, in milliseconds.
const OPEN = 300, BLINK = 900, REOPEN = 1020, INTO = 1500, NOISE = 1750, SETTLE = 2650, CODE = 2900;
const n = 25, m = 36 / 25, x0 = 14, y0 = 19;
const finder = (x, y) => { const f = (ox, oy) => { const dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; const k = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)); return k !== 2; }; return f(0, 0) ?? f(n - 7, 0) ?? f(0, n - 7); };
const quiet = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
const hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return ((h >>> 0) % 10000) / 10000; };
const codeOn = (i, j) => { if (i < 0 || j < 0 || i >= n || j >= n) return false; const f = finder(i, j); return f !== null ? f : quiet(i, j) ? false : hash(i, j, 7) > 0.52; };
const frame = Math.floor(t / 70);
// How much of the camera is noise (0..1), and how far it has settled.
const amount = t < INTO ? 0 : t < NOISE ? (t - INTO) / (NOISE - INTO) : 1;
const settled = t < SETTLE ? 0 : t < CODE ? (t - SETTLE) / (CODE - SETTLE) : 1;
let d = '';
if (amount > 0) {
for (let j = -8; j <= 29; j++) for (let i = -8; i <= 33; i++) {
const own = hash(i, j, 1);
let on;
if (settled > own) on = codeOn(i, j);
else on = own < amount && hash(i, j, 100 + frame) > 0.5;
if (on) d += 'M' + (x0 + i * m).toFixed(2) + ' ' + (y0 + j * m).toFixed(2) + 'h' + m.toFixed(2) + 'v' + m.toFixed(2) + 'h-' + m.toFixed(2) + 'z';
}
}
const reversed = t >= BLINK;
const caption = t < OPEN ? '0.0 s · the mark as it is, red on black, the eye shut'
: t < BLINK ? '0.3 s · the eye opens'
: t < REOPEN ? '0.9 s · a blink, and the camera turns solid'
: t < INTO ? '1.0 s · open again: black on the colour'
: t < NOISE ? '1.5 s · the eye gives way to noise (a quarter of a second)'
: t < SETTLE ? '1.75 s · hard-edged noise fills the whole camera (0.9 s)'
: t < CODE ? '2.65 s · the noise settles into the code (a quarter of a second)'
: '2.9 s · the code. (Repeats here every eight seconds; in the app, once when the session starts.)';
return {
bodyFill: reversed ? '#ff6b5e' : 'none',
cellsD: d,
shut: t < OPEN || (t >= BLINK && t < REOPEN),
open: (t >= OPEN && t < BLINK) || (t >= REOPEN && t < NOISE),
eyeInk: reversed ? '#000' : '#ff6b5e',
eyeOpacity: t >= INTO ? Math.max(0, 1 - amount) : 1,
textOpacity: t >= CODE ? 1 : 0,
caption,
replay: () => { this.start = Date.now(); this.setState({ t: 0 }); },
};
}
}
</script>
</body>
</html>
