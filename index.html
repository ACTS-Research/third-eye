<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>3rdEyeCam</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0c0d10; color: #e8e9ee; font: 16px/1.5 system-ui, sans-serif;
      }
      main { width: min(90vw, 420px); text-align: center; }
      h1 { font-size: 28px; letter-spacing: 0.04em; margin: 0 0 6px; }
      p { color: #9a9daa; margin: 0 0 28px; }
      a {
        display: block; padding: 18px; margin: 12px 0; border-radius: 12px;
        background: #1b1d24; color: inherit; text-decoration: none; font-weight: 600;
        border: 1px solid #2c2f3a;
      }
      a small { display: block; font-weight: 400; color: #9a9daa; }
      a:hover { border-color: #d6ff3f; }
    </style>
  </head>
  <body>
    <main>
      <h1>3rdEyeCam</h1>
      <p>Live video instrument</p>
      <a id="control" href="./control/">Control<small>On the Mac, in Chrome</small></a>
      <a id="phone" href="./phone/">Phone<small>On the iPhone, in Safari</small></a>
    </main>
    <script>
      // Phones land on the sender, everything else on the control page.
      if (/iPhone|iPad|Android/i.test(navigator.userAgent)) {
        document.getElementById('phone').style.borderColor = '#d6ff3f';
      } else {
        document.getElementById('control').style.borderColor = '#d6ff3f';
      }
    </script>
  </body>
</html>
